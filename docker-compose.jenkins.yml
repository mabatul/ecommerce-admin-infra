# Local Jenkins for the 3 repos. A single instance (no point running 3
# separate Jenkins servers for local development), but with ONE JOB PER
# REPO — each reads its own repo's Jenkinsfile and is triggered
# independently, with its own Railway deploy parameters/credentials. See
# jenkins/README.md.
services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: ecommerce-admin-jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      # Docker-outside-of-Docker: the HOST's socket (see jenkins/README.md).
      - /var/run/docker.sock:/var/run/docker.sock
      # The 3 repos, read-only, each as a local Git remote
      # (file:///home/jenkins/source-<repo>) for the corresponding job.
      - .:/home/jenkins/source-infra:ro
      - ${BACKEND_PATH:-../ecommerce-admin-backend}:/home/jenkins/source-backend:ro
      - ${FRONTEND_PATH:-../ecommerce-admin-frontend}:/home/jenkins/source-frontend:ro

volumes:
  jenkins-home:
