name: CI

# Validates the CloudFormation template and smoke-tests it against a real
# LocalStack (GitHub's runners have Docker preinstalled).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ecommerce-admin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install cfn-lint
      - run: cfn-lint infrastructure/cloudformation/main.yaml

      - name: Deploy to LocalStack (smoke test)
        run: ./scripts/ci-deploy-local.sh smoke

      - name: Health check
        run: ./scripts/ci-deploy-local.sh health

      - name: Tear down
        if: always()
        run: ./scripts/ci-teardown.sh
