# Brings up ONLY the infrastructure: LocalStack, with the CloudFormation
# stack deployed automatically once it's ready (see scripts/localstack-init.sh).
#
# This repo does NOT build or start backend/frontend — each of those has
# its own docker-compose.yml and starts independently, connecting back to
# this LocalStack instance over the host (see each repo's README). That's
# on purpose: infra doesn't need to know backend/frontend exist, and
# backend/frontend don't need to know how infra is built.
services:
  localstack:
    image: localstack/localstack:3.8
    container_name: ecommerce-admin-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-dynamodb,s3,cloudformation,iam,ssm,sts}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=${LOCALSTACK_PERSISTENCE:-0}
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - ./infrastructure:/infrastructure:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  localstack-data:
