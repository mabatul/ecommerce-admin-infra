# Brings up the full local environment: LocalStack + backend + frontend.
#
# Assumes the 3 repos are cloned as sibling folders:
#   workspace/
#     ecommerce-admin-infra/       <- this repo
#     ecommerce-admin-backend/
#     ecommerce-admin-frontend/
#
# If your checkout has a different layout, adjust the `context`/volumes
# below, or set BACKEND_PATH / FRONTEND_PATH before running `docker compose up`.
services:
  localstack:
    image: localstack/localstack:3.8
    container_name: ecommerce-admin-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-dynamodb,s3,cloudformation,iam,ssm,sts}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=${LOCALSTACK_PERSISTENCE:-0}
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - ./infrastructure:/infrastructure:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ${BACKEND_PATH:-../ecommerce-admin-backend}
      dockerfile: Dockerfile
    container_name: ecommerce-admin-backend
    environment:
      - ENVIRONMENT=local
      - PROJECT_NAME=${PROJECT_NAME:-ecommerce-admin}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ${BACKEND_PATH:-../ecommerce-admin-backend}:/app
      - backend-node-modules:/app/node_modules
      - backend-next-cache:/app/.next
    depends_on:
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: ${FRONTEND_PATH:-../ecommerce-admin-frontend}
      dockerfile: Dockerfile
    container_name: ecommerce-admin-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ${FRONTEND_PATH:-../ecommerce-admin-frontend}:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      - backend

volumes:
  localstack-data:
  backend-node-modules:
  backend-next-cache:
  frontend-node-modules:
  frontend-next-cache:
